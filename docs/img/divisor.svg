<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="430" viewBox="0 0 1000 430">
  <rect width="1000" height="430" fill="#ffffff"/>
  <text x="40" y="46" font-size="22" font-weight="700" fill="#0f172a" font-family="Arial, Helvetica, sans-serif">Divisor de tensión</text>
  <text x="40" y="70" font-size="13" fill="#64748b" font-family="Arial, Helvetica, sans-serif">Obligatorio cuando la salida del sensor supera 3.3 V</text>

  <line x1="90" y1="150" x2="250" y2="150" stroke="#0f172a" stroke-width="2.5"/>
  <text x="90" y="132" font-size="12" fill="#475569" font-family="Arial, Helvetica, sans-serif">Entrada (sensor)</text>

  <rect x="250" y="132" width="110" height="36" rx="4" fill="#ffffff" stroke="#0f172a" stroke-width="2"/>
  <text x="305" y="156" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a" font-family="Arial, Helvetica, sans-serif">R1 4.7k</text>

  <line x1="360" y1="150" x2="470" y2="150" stroke="#0f172a" stroke-width="2.5"/>
  <circle cx="470" cy="150" r="6" fill="#0891b2"/>
  <text x="470" y="126" text-anchor="middle" font-size="12" font-weight="700" fill="#0891b2" font-family="Arial, Helvetica, sans-serif">Vout</text>
  <line x1="470" y1="150" x2="600" y2="150" stroke="#0891b2" stroke-width="2.5" marker-end="url(#a)"/>
  <text x="540" y="177" text-anchor="middle" font-size="12" fill="#0891b2" font-family="Arial, Helvetica, sans-serif">→ GPIO 3.3 V</text>

  <rect x="452" y="190" width="36" height="110" rx="4" fill="#ffffff" stroke="#0f172a" stroke-width="2"/>
  <text x="470" y="252" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a" font-family="Arial, Helvetica, sans-serif" transform="rotate(-90 470 252)">R2 4.7k</text>
  <line x1="470" y1="300" x2="470" y2="340" stroke="#0f172a" stroke-width="2.5"/>
  <line x1="440" y1="340" x2="500" y2="340" stroke="#0f172a" stroke-width="3"/>
  <line x1="452" y1="348" x2="488" y2="348" stroke="#0f172a" stroke-width="2"/>
  <line x1="462" y1="356" x2="478" y2="356" stroke="#0f172a" stroke-width="2"/>
  <text x="512" y="346" font-size="12" fill="#475569" font-family="Arial, Helvetica, sans-serif">GND</text>

  <rect x="690" y="110" width="290" height="150" rx="10" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="708" y="138" font-size="12" font-weight="700" fill="#64748b" font-family="Arial, Helvetica, sans-serif">FÓRMULA</text>
  <text x="708" y="168" font-size="13" fill="#0f172a" font-family="Arial, Helvetica, sans-serif">Vout = Vin · R2 / (R1 + R2)</text>
  <text x="708" y="196" font-size="12.5" fill="#0891b2" font-family="Arial, Helvetica, sans-serif">Con R1 = R2 → Vout = Vin / 2</text>
  <text x="708" y="228" font-size="11.5" fill="#64748b" font-family="Arial, Helvetica, sans-serif">Para el firmware: factor = Vin / Vout</text>

  <text x="90" y="392" font-size="12" fill="#475569" font-family="Arial, Helvetica, sans-serif">Se usa en: turbidez TS-300B (A: hasta ~4.5 V → 2.25 V)   ·   pH PH-7BNC (Po: hasta ~3.8 V → 1.9 V)</text>
  <defs>
    <marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#0891b2"/>
    </marker>
  </defs>
</svg>