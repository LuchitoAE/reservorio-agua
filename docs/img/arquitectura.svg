<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="900" viewBox="0 0 1500 900">
<defs><marker id="m" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10z" fill="#64748b"/></marker></defs>
<rect width="1500" height="900" fill="#ffffff"/>
<rect width="1500" height="96" fill="#f1f5f9"/>
<rect x="0" y="92" width="1500" height="4" fill="#0891b2"/>
<text x="40" y="44" font-size="26" font-weight="700" fill="#0f172a" text-anchor="start" font-family="Arial, Helvetica, sans-serif">Cómo viajan los datos</text>
<text x="40" y="72" font-size="14" font-weight="400" fill="#64748b" text-anchor="start" font-family="Arial, Helvetica, sans-serif">De los sensores de la maqueta a la pantalla y a la página web</text>
<rect x="30" y="130" width="380" height="330" rx="16" fill="#ffffff" stroke="#059669" stroke-width="2.5"/>
<rect x="30" y="142" width="6" height="306" rx="3" fill="#059669"/>
<text x="54" y="164" font-size="18" font-weight="700" fill="#0f172a" text-anchor="start" font-family="Arial, Helvetica, sans-serif">Sensores (6)</text>
<text x="54" y="186" font-size="13" font-weight="600" fill="#059669" text-anchor="start" font-family="Arial, Helvetica, sans-serif">Miden el agua del tanque</text>
<text x="54" y="214" font-size="13" font-weight="400" fill="#334155" text-anchor="start" font-family="Arial, Helvetica, sans-serif">• Nivel de agua (ultrasónico)</text>
<text x="54" y="235" font-size="13" font-weight="400" fill="#334155" text-anchor="start" font-family="Arial, Helvetica, sans-serif">• Agua que entra (caudalímetro)</text>
<text x="54" y="256" font-size="13" font-weight="400" fill="#334155" text-anchor="start" font-family="Arial, Helvetica, sans-serif">• Agua que sale (caudalímetro)</text>
<text x="54" y="277" font-size="13" font-weight="400" fill="#334155" text-anchor="start" font-family="Arial, Helvetica, sans-serif">• Temperatura</text>
<text x="54" y="298" font-size="13" font-weight="400" fill="#334155" text-anchor="start" font-family="Arial, Helvetica, sans-serif">• pH (acidez)</text>
<text x="54" y="319" font-size="13" font-weight="400" fill="#334155" text-anchor="start" font-family="Arial, Helvetica, sans-serif">• Claridad (turbidez)</text>
<text x="54" y="340" font-size="13" font-weight="400" fill="#334155" text-anchor="start" font-family="Arial, Helvetica, sans-serif"></text>
<text x="54" y="361" font-size="13" font-weight="400" fill="#334155" text-anchor="start" font-family="Arial, Helvetica, sans-serif">Alimentados con 5 V por USB</text>
<rect x="560" y="170" width="360" height="250" rx="16" fill="#ffffff" stroke="#0f2a3d" stroke-width="2.5"/>
<rect x="560" y="182" width="6" height="226" rx="3" fill="#0f2a3d"/>
<text x="584" y="204" font-size="18" font-weight="700" fill="#0f172a" text-anchor="start" font-family="Arial, Helvetica, sans-serif">ESP32</text>
<text x="584" y="226" font-size="13" font-weight="600" fill="#0f2a3d" text-anchor="start" font-family="Arial, Helvetica, sans-serif">El "cerebro" de la maqueta</text>
<text x="584" y="254" font-size="13" font-weight="400" fill="#334155" text-anchor="start" font-family="Arial, Helvetica, sans-serif">Lee los sensores varias veces</text>
<text x="584" y="275" font-size="13" font-weight="400" fill="#334155" text-anchor="start" font-family="Arial, Helvetica, sans-serif">por segundo, filtra el ruido y</text>
<text x="584" y="296" font-size="13" font-weight="400" fill="#334155" text-anchor="start" font-family="Arial, Helvetica, sans-serif">calcula nivel, litros y caudal.</text>
<text x="584" y="317" font-size="13" font-weight="400" fill="#334155" text-anchor="start" font-family="Arial, Helvetica, sans-serif">Guarda las calibraciones y se</text>
<text x="584" y="338" font-size="13" font-weight="400" fill="#334155" text-anchor="start" font-family="Arial, Helvetica, sans-serif">conecta al WiFi de la casa.</text>
<line x1="410" y1="295" x2="556" y2="295" stroke="#64748b" stroke-width="3" marker-end="url(#m)"/>
<text x="483.0" y="285.0" font-size="12" font-weight="600" fill="#475569" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">señales</text>
<rect x="1060" y="120" width="410" height="150" rx="16" fill="#ffffff" stroke="#0891b2" stroke-width="2.5"/>
<rect x="1060" y="132" width="6" height="126" rx="3" fill="#0891b2"/>
<text x="1084" y="154" font-size="18" font-weight="700" fill="#0f172a" text-anchor="start" font-family="Arial, Helvetica, sans-serif">Pantalla LCD</text>
<text x="1084" y="176" font-size="13" font-weight="600" fill="#0891b2" text-anchor="start" font-family="Arial, Helvetica, sans-serif">En la maqueta, para el público</text>
<text x="1084" y="204" font-size="13" font-weight="400" fill="#334155" text-anchor="start" font-family="Arial, Helvetica, sans-serif">Nivel, calidad del agua y caudal,</text>
<text x="1084" y="225" font-size="13" font-weight="400" fill="#334155" text-anchor="start" font-family="Arial, Helvetica, sans-serif">una página cada 4 segundos.</text>
<line x1="920" y1="240" x2="1056" y2="200" stroke="#64748b" stroke-width="3" marker-end="url(#m)"/>
<text x="988.0" y="210.0" font-size="12" font-weight="600" fill="#475569" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">cable</text>
<rect x="1060" y="300" width="410" height="170" rx="16" fill="#ffffff" stroke="#0369a1" stroke-width="2.5"/>
<rect x="1060" y="312" width="6" height="146" rx="3" fill="#0369a1"/>
<text x="1084" y="334" font-size="18" font-weight="700" fill="#0f172a" text-anchor="start" font-family="Arial, Helvetica, sans-serif">Página web de la maqueta</text>
<text x="1084" y="356" font-size="13" font-weight="600" fill="#0369a1" text-anchor="start" font-family="Arial, Helvetica, sans-serif">Red WiFi de la casa</text>
<text x="1084" y="384" font-size="13" font-weight="400" fill="#334155" text-anchor="start" font-family="Arial, Helvetica, sans-serif">http://192.168.2.200</text>
<text x="1084" y="405" font-size="13" font-weight="400" fill="#334155" text-anchor="start" font-family="Arial, Helvetica, sans-serif">Tablero con datos en vivo, modelo 3D,</text>
<text x="1084" y="426" font-size="13" font-weight="400" fill="#334155" text-anchor="start" font-family="Arial, Helvetica, sans-serif">caso real y mantenimiento (calibración).</text>
<line x1="920" y1="330" x2="1056" y2="380" stroke="#64748b" stroke-width="3" marker-end="url(#m)"/>
<text x="988.0" y="345.0" font-size="12" font-weight="600" fill="#475569" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">WiFi</text>
<rect x="560" y="560" width="520" height="290" rx="16" fill="#ffffff" stroke="#7c3aed" stroke-width="2.5"/>
<rect x="560" y="572" width="6" height="266" rx="3" fill="#7c3aed"/>
<text x="584" y="594" font-size="18" font-weight="700" fill="#0f172a" text-anchor="start" font-family="Arial, Helvetica, sans-serif">Página publicada en internet</text>
<text x="584" y="616" font-size="13" font-weight="600" fill="#7c3aed" text-anchor="start" font-family="Arial, Helvetica, sans-serif">reservorio-agua-web.vercel.app</text>
<text x="584" y="644" font-size="13" font-weight="400" fill="#334155" text-anchor="start" font-family="Arial, Helvetica, sans-serif">Sin conexión con la maqueta: muestra una</text>
<text x="584" y="665" font-size="13" font-weight="400" fill="#334155" text-anchor="start" font-family="Arial, Helvetica, sans-serif">SIMULACIÓN de un día típico (bien marcada).</text>
<text x="584" y="686" font-size="13" font-weight="400" fill="#334155" text-anchor="start" font-family="Arial, Helvetica, sans-serif">En el mismo WiFi (Chrome/Edge): botón "Conectar</text>
<text x="584" y="707" font-size="13" font-weight="400" fill="#334155" text-anchor="start" font-family="Arial, Helvetica, sans-serif">con la maqueta" y se ven los datos reales.</text>
<text x="584" y="728" font-size="13" font-weight="400" fill="#334155" text-anchor="start" font-family="Arial, Helvetica, sans-serif">Desde cualquier lugar: requiere activar la nube</text>
<text x="584" y="749" font-size="13" font-weight="400" fill="#334155" text-anchor="start" font-family="Arial, Helvetica, sans-serif">(Supabase), ya preparada en el proyecto.</text>
<line x1="740" y1="420" x2="740" y2="556" stroke="#64748b" stroke-width="3" stroke-dasharray="7 6" marker-end="url(#m)"/>
<text x="752" y="495" font-size="12" font-weight="600" fill="#475569" text-anchor="start" font-family="Arial, Helvetica, sans-serif">conexión directa o nube</text>
<rect x="1160" y="560" width="310" height="290" rx="16" fill="#ffffff" stroke="#94a3b8" stroke-width="2.5" stroke-dasharray="8 6"/>
<rect x="1160" y="572" width="6" height="266" rx="3" fill="#94a3b8"/>
<text x="1184" y="594" font-size="18" font-weight="700" fill="#0f172a" text-anchor="start" font-family="Arial, Helvetica, sans-serif">Nube (opcional)</text>
<text x="1184" y="616" font-size="13" font-weight="600" fill="#94a3b8" text-anchor="start" font-family="Arial, Helvetica, sans-serif">Supabase</text>
<text x="1184" y="644" font-size="13" font-weight="400" fill="#334155" text-anchor="start" font-family="Arial, Helvetica, sans-serif">El ESP32 enviaría sus datos</text>
<text x="1184" y="665" font-size="13" font-weight="400" fill="#334155" text-anchor="start" font-family="Arial, Helvetica, sans-serif">cada 5 s con una clave secreta;</text>
<text x="1184" y="686" font-size="13" font-weight="400" fill="#334155" text-anchor="start" font-family="Arial, Helvetica, sans-serif">la página los leería desde</text>
<text x="1184" y="707" font-size="13" font-weight="400" fill="#334155" text-anchor="start" font-family="Arial, Helvetica, sans-serif">cualquier lugar. Falta crear</text>
<text x="1184" y="728" font-size="13" font-weight="400" fill="#334155" text-anchor="start" font-family="Arial, Helvetica, sans-serif">el proyecto y activarla.</text>
<line x1="1156" y1="700" x2="1084" y2="700" stroke="#64748b" stroke-width="3" stroke-dasharray="7 6" marker-end="url(#m)"/>
</svg>