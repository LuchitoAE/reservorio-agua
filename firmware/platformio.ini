; Reservorio de Agua - firmware ESP32
; Plataforma: PlatformIO + Arduino framework
;
;   Por cable USB:   ./tools/pio.sh run -d firmware -t upload
;   Por WiFi (OTA):  ./tools/ota.sh            (firmware)
;                    ./tools/ota.sh uploadfs   (archivos web)

[platformio]
default_envs = esp32dev

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
upload_speed = 921600
board_build.filesystem = littlefs

lib_deps =
    bblanchon/ArduinoJson@^7.2.0
    paulstoffregen/OneWire@^2.3.8
    milesburton/DallasTemperature@^3.11.0
    marcoschwartz/LiquidCrystal_I2C@^1.1.4

build_unflags = -std=gnu++11
build_flags =
    -std=gnu++17
    -DCORE_DEBUG_LEVEL=1

; Actualización por WiFi. No usar directo: ./tools/ota.sh pone la IP y la clave
; (las lee de include/secrets.h, que no se sube a Git).
; El ESP32 se conecta de vuelta a la PC en el puerto TCP 8266: si la PC tiene
; firewall (ufw), hay que permitirlo:  sudo ufw allow from <IP del ESP32> to any port 8266 proto tcp
[env:ota]
extends = env:esp32dev
upload_protocol = espota
upload_port = ${sysenv.RESERVORIO_HOST}
upload_flags =
    --auth=${sysenv.RESERVORIO_OTA_PASS}
    --port=3232
    --host_port=8266
